name: 报告问题
description: 反馈随声练的启动、权限、识别、音符或评分问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请写明复现步骤、系统版本、Mac 型号和使用的播放器。Issue 可能公开。
        如果应用提供“报告问题”功能，请先查看报告中包含的内容，再决定是否附上。
        日志可能包含歌曲名称。请勿上传歌曲音频、练习录音、凭据或其他私密信息。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？
      description: 你做了什么、预期结果是什么、实际发生了什么？如果与歌曲进度有关，请说明大致位置。
    validations:
      required: true
  - type: input
    id: song
    attributes:
      label: 歌曲（可选）
      description: 如果问题只发生在某首歌，请填写歌名和歌手；避免提供私人播放列表信息。
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      description: 可在 Apple 菜单 → 关于本机中查看。
      placeholder: 例如 macOS 15.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac 型号
      description: 请提供机型、芯片和内存。
      placeholder: 例如 MacBook Air M2，8 GB
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: 播放器
      options:
        - Spotify
        - Apple Music
        - 浏览器中的 YouTube
        - 其他
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 是否启用了播放器控制？
      description: 如果不确定，请选择“不确定”。
      options:
        - 已启用控制
        - 仅监听声音
        - 不确定
  - type: input
    id: output
    attributes:
      label: 音频输出设备
      description: 播放音乐时使用的设备。
      placeholder: 例如 AirPods Pro、MacBook 扬声器、有线耳机、USB 声卡
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 随声练版本（可选）
      description: 可在应用的关于页面查看。
      placeholder: 例如 0.1.0
  - type: textarea
    id: report
    attributes:
      label: 诊断报告或截图（可选）
      description: 提交前请检查是否含有私人信息。请勿附加录音或音乐文件。
